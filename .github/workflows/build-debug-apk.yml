name: Construir APK Android validado

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Canal del APK
        required: true
        default: beta
        type: choice
        options:
          - beta
          - stable

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate y APK descargable
    uses: ./.github/workflows/quality-gate.yml
    with:
      channel: ${{ inputs.channel }}
    secrets: inherit
