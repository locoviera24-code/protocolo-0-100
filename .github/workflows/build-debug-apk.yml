name: Construir APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-apk:
    name: Generar APK instalable
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma Android necesaria
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Generar configuracion Firebase opcional
        shell: pwsh
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
        run: ./scripts/write-firebase-config.ps1 -OutputPath firebase-config.js

      - name: Sincronizar app web dentro del APK
        shell: pwsh
        run: ./scripts/sync-web-assets.ps1

      - name: Validar contratos y assets Android
        shell: pwsh
        run: ./scripts/validate-app.ps1 -CheckAndroidAssets

      - name: Probar estrategia del service worker
        run: node ./scripts/test-service-worker.mjs

      - name: Probar rutina semanal y estado widget
        run: node ./scripts/test-workout-features.mjs

      - name: Probar Gym Party
        run: node ./scripts/test-gym-party.mjs

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compilar APK debug
        working-directory: android-native-wrapper
        run: gradle :app:assembleDebug --stacktrace

      - name: Preparar archivo APK
        run: |
          mkdir -p dist
          cp android-native-wrapper/app/build/outputs/apk/debug/app-debug.apk dist/protocolo-0-100-debug.apk

      - name: Subir APK como artifact descargable
        uses: actions/upload-artifact@v4
        with:
          name: protocolo-0-100-apk
          path: dist/protocolo-0-100-debug.apk
          retention-days: 30

      - name: Publicar APK como descarga directa
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v2.5.4 >/dev/null 2>&1 || gh release create v2.5.4 --title "Protocolo 0-100 v2.5.4" --notes "Corrige resumen semanal al eliminar series y agrega edicion por fecha en Gym Party."
          gh release upload v2.5.4 dist/protocolo-0-100-debug.apk --clobber
