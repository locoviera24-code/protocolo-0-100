name: Construir APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-apk:
    name: Generar APK instalable
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma Android necesaria
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Sincronizar app web dentro del APK
        shell: pwsh
        run: ./scripts/sync-web-assets.ps1

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compilar APK debug
        working-directory: android-native-wrapper
        run: gradle :app:assembleDebug --stacktrace

      - name: Preparar archivo APK
        run: |
          mkdir -p dist
          cp android-native-wrapper/app/build/outputs/apk/debug/app-debug.apk dist/protocolo-0-100-debug.apk

      - name: Subir APK como artifact descargable
        uses: actions/upload-artifact@v4
        with:
          name: protocolo-0-100-apk
          path: dist/protocolo-0-100-debug.apk
          retention-days: 30

      - name: Publicar APK como descarga directa
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.0 >/dev/null 2>&1 || gh release create v1.0.0 --title "Protocolo 0→100 v1.0.0" --notes "Primera versión instalable para Android."
          gh release upload v1.0.0 dist/protocolo-0-100-debug.apk --clobber
