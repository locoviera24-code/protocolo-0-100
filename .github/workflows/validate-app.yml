name: Validar aplicacion

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  validate:
    name: Validar contratos web y Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java para Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar pruebas Firebase
        run: npm ci

      - name: Comprobar estructura, datos, PWA y assets Android
        shell: pwsh
        run: ./scripts/validate-app.ps1 -CheckAndroidAssets

      - name: Probar estrategia del service worker
        run: node ./scripts/test-service-worker.mjs

      - name: Probar rutina semanal y estado widget
        run: node ./scripts/test-workout-features.mjs

      - name: Probar metricas de gimnasio
        run: node ./scripts/test-workout-metrics.mjs

      - name: Probar Gym Party
        run: node ./scripts/test-gym-party.mjs

      - name: Probar reglas Firestore en Emulator
        run: npm run test:rules
