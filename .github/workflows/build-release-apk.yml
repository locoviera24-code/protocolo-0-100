name: Publicar APK Android release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag inmutable; estable usa v<version>-build.<build>, prerelease exige sufijo
        required: false
        type: string
      prerelease:
        description: Marcar como version preliminar
        required: false
        default: false
        type: boolean
permissions:
  contents: read

jobs:
  quality:
    name: Quality gate previo al release
    uses: ./.github/workflows/quality-gate.yml
    with:
      channel: ${{ inputs.prerelease && 'beta' || 'stable' }}
    secrets:
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
      FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}

  release-apk:
    name: Compilar APK firmado y publicar checksum
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configurar Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Resolver identidad inmutable de release
        id: identity
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
        run: node ./scripts/release-identity.mjs

      - name: Configurar Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Instalar plataforma Android necesaria
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Generar configuracion Firebase opcional
        shell: pwsh
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
        run: ./scripts/write-firebase-config.ps1 -OutputPath firebase-config.js

      - name: Sincronizar y validar app web
        shell: pwsh
        run: |
          npm run build:precache
          ./scripts/sync-web-assets.ps1
          ./scripts/validate-app.ps1 -CheckAndroidAssets

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: '8.10.2'

      - name: Compilar APK release firmado
        working-directory: android-native-wrapper
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/protocolo-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Falta ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" && test -n "$ANDROID_KEY_ALIAS" && test -n "$ANDROID_KEY_PASSWORD" || (echo "Faltan Secrets de firma" && exit 1)
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"
          gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Preparar APK versionado y SHA-256
        id: package
        shell: bash
        env:
          APK_NAME: ${{ steps.identity.outputs.apk }}
          CHECKSUM_NAME: ${{ steps.identity.outputs.checksum }}
        run: |
          mkdir -p dist
          APK="dist/$APK_NAME"
          CHECKSUM="dist/$CHECKSUM_NAME"
          cp android-native-wrapper/app/build/outputs/apk/release/app-release.apk "$APK"
          sha256sum "$APK" > "$CHECKSUM"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"

      - name: Resolver ultimo APK stable compatible
        if: ${{ inputs.prerelease == false }}
        id: previous-stable
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > "$RUNNER_TEMP/previous-stable-release.json"
          node ./scripts/android-release-continuity.mjs select "$RUNNER_TEMP/previous-stable-release.json"

      - name: Descargar APK stable anterior
        if: ${{ inputs.prerelease == false }}
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_ASSET_ID: ${{ steps.previous-stable.outputs.asset_id }}
        shell: bash
        run: |
          test -n "$PREVIOUS_ASSET_ID" || (echo "No se resolvio un APK stable anterior." >&2; exit 1)
          gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$PREVIOUS_ASSET_ID" > "$RUNNER_TEMP/previous-stable.apk"
          test -s "$RUNNER_TEMP/previous-stable.apk" || (echo "No se pudo descargar el APK stable anterior." >&2; exit 1)

      - name: Verificar continuidad de firma y paquete Android
        if: ${{ inputs.prerelease == false }}
        env:
          PREVIOUS_CERT_REPORT: ${{ runner.temp }}/previous-stable-cert.txt
          CANDIDATE_CERT_REPORT: ${{ runner.temp }}/candidate-cert.txt
          PREVIOUS_BADGING_REPORT: ${{ runner.temp }}/previous-stable-badging.txt
          CANDIDATE_BADGING_REPORT: ${{ runner.temp }}/candidate-badging.txt
          CANDIDATE_APK: ${{ steps.package.outputs.apk }}
        shell: bash
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          test -x "$APKSIGNER" && test -x "$AAPT2" || (echo "Faltan herramientas Android para verificar la firma." >&2; exit 1)
          "$APKSIGNER" verify --print-certs "$RUNNER_TEMP/previous-stable.apk" > "$PREVIOUS_CERT_REPORT"
          "$APKSIGNER" verify --print-certs "$CANDIDATE_APK" > "$CANDIDATE_CERT_REPORT"
          "$AAPT2" dump badging "$RUNNER_TEMP/previous-stable.apk" > "$PREVIOUS_BADGING_REPORT"
          "$AAPT2" dump badging "$CANDIDATE_APK" > "$CANDIDATE_BADGING_REPORT"
          node ./scripts/android-release-continuity.mjs verify

      - name: Subir artifact release verificable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.identity.outputs.artifact }}
          path: |
            ${{ steps.package.outputs.apk }}
            ${{ steps.package.outputs.checksum }}
          retention-days: 90

      - name: Crear GitHub Release inmutable
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          APK: ${{ steps.package.outputs.apk }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
          TAG: ${{ steps.identity.outputs.tag }}
          TITLE: ${{ steps.identity.outputs.title }}
          VERSION_NAME: ${{ steps.identity.outputs.version }}
          BUILD_NUMBER: ${{ steps.identity.outputs.build }}
          VERSION_CODE: ${{ steps.identity.outputs.versionCode }}
        shell: bash
        run: |
          FLAGS=()
          if [ "$INPUT_PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "La release $TAG ya existe; los releases publicados son inmutables." >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "El tag $TAG ya existe; no se reutiliza ni se mueve." >&2
            exit 1
          fi
          gh release create "$TAG" "$APK" "$CHECKSUM" --target "$GITHUB_SHA" --title "$TITLE" --notes "APK Android release firmado para v$VERSION_NAME, build $BUILD_NUMBER, versionCode $VERSION_CODE. Commit: $GITHUB_SHA. Verifica la descarga con el archivo SHA-256." "${FLAGS[@]}"
