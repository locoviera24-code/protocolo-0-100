name: Publicar APK Android release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag inmutable; estable usa v<version>-build.<build>, prerelease exige sufijo
        required: false
        type: string
      prerelease:
        description: Marcar como version preliminar
        required: false
        default: false
        type: boolean
permissions:
  contents: write

jobs:
  quality:
    name: Quality gate previo al release
    uses: ./.github/workflows/quality-gate.yml
    with:
      channel: ${{ inputs.prerelease && 'beta' || 'stable' }}
    secrets: inherit

  release-apk:
    name: Compilar APK firmado y publicar checksum
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Resolver identidad inmutable de release
        id: identity
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
        run: node ./scripts/release-identity.mjs

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar plataforma Android necesaria
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Generar configuracion Firebase opcional
        shell: pwsh
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
        run: ./scripts/write-firebase-config.ps1 -OutputPath firebase-config.js

      - name: Sincronizar y validar app web
        shell: pwsh
        run: |
          npm run build:precache
          ./scripts/sync-web-assets.ps1
          ./scripts/validate-app.ps1 -CheckAndroidAssets

      - name: Decodificar keystore privado
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Falta ANDROID_KEYSTORE_BASE64" && exit 1)
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/protocolo-release.keystore"
          test -s "$RUNNER_TEMP/protocolo-release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/protocolo-release.keystore" >> "$GITHUB_ENV"

      - name: Configurar firma desde Secrets
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || (echo "Faltan Secrets de firma" && exit 1)
          echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Compilar APK release firmado
        working-directory: android-native-wrapper
        run: gradle :app:assembleRelease --stacktrace

      - name: Preparar APK versionado y SHA-256
        id: package
        shell: bash
        env:
          APK_NAME: ${{ steps.identity.outputs.apk }}
          CHECKSUM_NAME: ${{ steps.identity.outputs.checksum }}
        run: |
          mkdir -p dist
          APK="dist/$APK_NAME"
          CHECKSUM="dist/$CHECKSUM_NAME"
          cp android-native-wrapper/app/build/outputs/apk/release/app-release.apk "$APK"
          sha256sum "$APK" > "$CHECKSUM"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"

      - name: Subir artifact release verificable
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.identity.outputs.artifact }}
          path: |
            ${{ steps.package.outputs.apk }}
            ${{ steps.package.outputs.checksum }}
          retention-days: 90

      - name: Crear GitHub Release inmutable
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          APK: ${{ steps.package.outputs.apk }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
          TAG: ${{ steps.identity.outputs.tag }}
          TITLE: ${{ steps.identity.outputs.title }}
          VERSION_NAME: ${{ steps.identity.outputs.version }}
          BUILD_NUMBER: ${{ steps.identity.outputs.build }}
          VERSION_CODE: ${{ steps.identity.outputs.versionCode }}
        shell: bash
        run: |
          FLAGS=()
          if [ "$INPUT_PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "La release $TAG ya existe; los releases publicados son inmutables." >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "El tag $TAG ya existe; no se reutiliza ni se mueve." >&2
            exit 1
          fi
          gh release create "$TAG" "$APK" "$CHECKSUM" --target "$GITHUB_SHA" --title "$TITLE" --notes "APK Android release firmado para v$VERSION_NAME, build $BUILD_NUMBER, versionCode $VERSION_CODE. Commit: $GITHUB_SHA. Verifica la descarga con el archivo SHA-256." "${FLAGS[@]}"

      - name: Eliminar keystore temporal
        if: always()
        run: rm -f "$RUNNER_TEMP/protocolo-release.keystore"
