name: Publicar APK Android release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag de release; vacio usa v<versionName>
        required: false
        type: string
      prerelease:
        description: Marcar como version preliminar
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-apk:
    name: Compilar APK firmado y publicar checksum
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma Android necesaria
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Generar configuracion Firebase opcional
        shell: pwsh
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
        run: ./scripts/write-firebase-config.ps1 -OutputPath firebase-config.js

      - name: Sincronizar y validar app web
        shell: pwsh
        run: |
          ./scripts/sync-web-assets.ps1
          ./scripts/validate-app.ps1 -CheckAndroidAssets

      - name: Probar contratos de release Android
        run: node ./scripts/test-android-release.mjs

      - name: Decodificar keystore privado
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Falta ANDROID_KEYSTORE_BASE64" && exit 1)
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/protocolo-release.keystore"
          test -s "$RUNNER_TEMP/protocolo-release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/protocolo-release.keystore" >> "$GITHUB_ENV"

      - name: Configurar firma desde Secrets
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || (echo "Faltan Secrets de firma" && exit 1)
          echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compilar APK release firmado
        working-directory: android-native-wrapper
        run: gradle :app:assembleRelease --stacktrace

      - name: Preparar APK versionado y SHA-256
        id: package
        shell: bash
        run: |
          VERSION_NAME=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android-native-wrapper/app/build.gradle | head -n 1)
          test -n "$VERSION_NAME"
          mkdir -p dist
          APK="dist/protocolo-0-100-v${VERSION_NAME}-release.apk"
          cp android-native-wrapper/app/build/outputs/apk/release/app-release.apk "$APK"
          sha256sum "$APK" > "${APK}.sha256"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "checksum=${APK}.sha256" >> "$GITHUB_OUTPUT"

      - name: Subir artifact release verificable
        uses: actions/upload-artifact@v4
        with:
          name: protocolo-0-100-v${{ steps.package.outputs.version }}-release
          path: |
            ${{ steps.package.outputs.apk }}
            ${{ steps.package.outputs.checksum }}
          retention-days: 90

      - name: Crear o actualizar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.release_tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          APK: ${{ steps.package.outputs.apk }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
          VERSION_NAME: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_TYPE:-}"
          if [ "$TAG" = "tag" ]; then TAG="$GITHUB_REF_NAME"; else TAG="${INPUT_TAG:-v$VERSION_NAME}"; fi
          FLAGS=()
          if [ "$INPUT_PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$CHECKSUM" --clobber
          else
            gh release create "$TAG" "$APK" "$CHECKSUM" --title "Protocolo 0-100 v$VERSION_NAME" --notes "APK Android release firmado. Verifica la descarga con el archivo SHA-256." "${FLAGS[@]}"
          fi

      - name: Eliminar keystore temporal
        if: always()
        run: rm -f "$RUNNER_TEMP/protocolo-release.keystore"
