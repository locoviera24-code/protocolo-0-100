name: Publicar PWA en GitHub Pages

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Beta solo genera artifacts; stable publica GitHub Pages
        required: true
        default: beta
        type: choice
        options:
          - beta
          - stable
  push:
    branches:
      - main
    paths:
      - '.github/stable-release.json'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'push' && 'stable' || inputs.channel }}
  cancel-in-progress: false

jobs:
  promotion-guard:
    name: Validar metadata de promocion
    runs-on: ubuntu-latest
    env:
      PAGES_CHANNEL: ${{ github.event_name == 'push' && 'stable' || inputs.channel }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configurar Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Validar alineacion stable
        run: node ./scripts/stable-pages-guard.mjs

  quality:
    name: Quality gate previo a Pages
    needs: promotion-guard
    uses: ./.github/workflows/quality-gate.yml
    with:
      channel: ${{ github.event_name == 'push' && 'stable' || inputs.channel }}
    secrets:
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
      FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}

  deploy:
    name: Publicar canal estable
    needs: [promotion-guard, quality]
    if: github.event_name == 'push' || inputs.channel == 'stable'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar artifact web validado
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.quality.outputs.web_artifact }}
          path: dist-pages

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Preparar artifact de Pages
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist-pages

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
