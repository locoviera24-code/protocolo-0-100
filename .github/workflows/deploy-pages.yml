name: Publicar PWA en GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - index.html
      - app-version.json
      - app-version.js
      - nutrition-data.js
      - fdc-client.js
      - workout-features.js
      - workout-ranking.js
      - workout-metrics.js
      - workout-store.js
      - workout-plan.js
      - workout-ui.js
      - firebase-service.js
      - gym-party.js
      - gym-party-sync.js
      - gym-party-metrics.js
      - gym-party-ui.js
      - firebase-config.js
      - advanced-features.js
      - manifest.webmanifest
      - sw.js
      - ui/**
      - progress/**
      - styles/**
      - icons/**
      - firebase/**
      - scripts/write-firebase-config.ps1
      - .github/workflows/deploy-pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar aplicacion web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Validar contratos web
        shell: pwsh
        run: ./scripts/validate-app.ps1

      - name: Probar estrategia del service worker
        run: node ./scripts/test-service-worker.mjs

      - name: Probar rutina semanal y estado widget
        run: node ./scripts/test-workout-features.mjs

      - name: Probar metricas de gimnasio
        run: node ./scripts/test-workout-metrics.mjs

      - name: Probar Gym Party
        run: node ./scripts/test-gym-party.mjs

      - name: Probar sincronizacion incremental
        run: node ./scripts/test-gym-party-sync.mjs

      - name: Probar limites modulares
        run: npm run test:modules

      - name: Probar presupuestos del sistema visual
        run: npm run test:design

      - name: Verificar version unica
        run: npm run test:version

      - name: Probar router y deep links
        run: npm run test:router

      - name: Probar presupuesto sticky y teclado
        run: npm run test:layout

      - name: Probar Inicio y Ajustes
        run: npm run test:home-settings

      - name: Probar contratos funcionales de Ajustes
        run: npm run test:settings

      - name: Probar Progreso consolidado
        run: npm run test:progress

      - name: Probar seguridad del WebView Android
        run: node ./scripts/test-android-webview-security.mjs

      - name: Probar contratos de release Android
        run: node ./scripts/test-android-release.mjs

      - name: Probar accesibilidad web y movil
        run: node ./scripts/test-accessibility.mjs

      - name: Preparar archivos publicos
        run: |
          mkdir -p dist-pages/icons dist-pages/styles dist-pages/ui dist-pages/progress
          cp index.html app-version.json app-version.js nutrition-data.js fdc-client.js workout-store.js workout-plan.js workout-metrics.js workout-ranking.js workout-ui.js workout-features.js firebase-config.js firebase-service.js gym-party-sync.js gym-party-metrics.js gym-party-ui.js gym-party.js advanced-features.js manifest.webmanifest sw.js dist-pages/
          cp icons/icon-192.png icons/icon-512.png dist-pages/icons/
          cp styles/*.css dist-pages/styles/
          cp ui/*.js dist-pages/ui/
          cp progress/*.js dist-pages/progress/

      - name: Generar configuracion Firebase opcional
        shell: pwsh
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
        run: ./scripts/write-firebase-config.ps1 -OutputPath dist-pages/firebase-config.js

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
