name: Publicar PWA en GitHub Pages

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Beta solo genera artifacts; stable publica GitHub Pages
        required: true
        default: beta
        type: choice
        options:
          - beta
          - stable
  push:
    tags:
      - 'baseline-stable-*'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'push' && 'stable' || inputs.channel }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality gate previo a Pages
    uses: ./.github/workflows/quality-gate.yml
    with:
      channel: ${{ github.event_name == 'push' && 'stable' || inputs.channel }}
    secrets: inherit

  deploy:
    name: Publicar canal estable
    needs: quality
    if: github.event_name == 'push' || inputs.channel == 'stable'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar artifact web validado
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.quality.outputs.web_artifact }}
          path: dist-pages

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar artifact de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
