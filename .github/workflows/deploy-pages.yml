name: Publicar PWA en GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - index.html
      - nutrition-data.js
      - fdc-client.js
      - advanced-features.js
      - manifest.webmanifest
      - sw.js
      - icons/**
      - .github/workflows/deploy-pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar aplicacion web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar archivos publicos
        run: |
          mkdir -p dist-pages/icons
          cp index.html nutrition-data.js fdc-client.js advanced-features.js manifest.webmanifest sw.js dist-pages/
          cp icons/icon-192.png icons/icon-512.png dist-pages/icons/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
