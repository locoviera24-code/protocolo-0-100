    <text x="49" y="221" fill="#eef5ff" font-size="24">-</text>
    <text x="310" y="221" fill="#eef5ff" font-size="19" font-weight="700">8 reps</text>
    <text x="571" y="221" fill="#eef5ff" font-size="24">+</text>
    <rect x="20" y="254" width="76" height="58" rx="14" fill="#14263a"/>
