<svg xmlns="http://www.w3.org/2000/svg" width="560" height="390" viewBox="0 0 560 390" role="img" aria-labelledby="title desc">
  <title id="title">Preview del widget expandido</title>
  <desc id="desc">Rutina, progreso, ultima carga, maximo comparable y selector directo de ejercicio.</desc>
  <rect width="560" height="390" rx="24" fill="#0b1726"/>
  <text x="24" y="34" fill="#dbeaff" font-family="Arial,sans-serif" font-size="13">Miercoles | Torso B</text>
  <text x="536" y="34" text-anchor="end" fill="#98f5c2" font-family="Arial,sans-serif" font-size="13">2/9 | 5 series</text>
  <text x="24" y="66" fill="#ffffff" font-family="Arial,sans-serif" font-size="20" font-weight="700">Press de banca</text>
  <text x="24" y="90" fill="#98f5c2" font-family="Arial,sans-serif" font-size="13">Serie 3 | 2 del ejercicio | 5 de pecho</text>
  <text x="24" y="112" fill="#dbeaff" font-family="Arial,sans-serif" font-size="12">Ultima: 57,5 kg x 9 | Max.: 70 kg x 5</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
