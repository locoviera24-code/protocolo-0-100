  <text x="42" y="118" fill="#fff" font-family="sans-serif" font-size="20" font-weight="700">Elegir · Press de banca</text>
  <text x="24" y="164" fill="#dbeaff" font-family="sans-serif" font-size="14">Ultima: 77,5 kg x 9 · Mejor: 90 kg x 5</text>
  <g font-family="sans-serif" text-anchor="middle">
