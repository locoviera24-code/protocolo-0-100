    <rect x="78" y="128" width="404" height="48" rx="12" fill="#172942"/><text x="280" y="158" fill="#eef5ff" font-size="16" font-weight="700">8 reps</text>
    <rect x="492" y="128" width="48" height="48" rx="12" fill="#172942"/><text x="516" y="159" fill="#eef5ff" font-size="22">+</text>
    <rect x="20" y="188" width="56" height="48" rx="12" fill="#172942"/><text x="48" y="218" fill="#eef5ff" font-size="14">-0,5</text>
    <rect x="86" y="188" width="388" height="48" rx="12" fill="#172942"/><text x="280" y="218" fill="#eef5ff" font-size="15" font-weight="700">60 kg | tocar para paso 5</text>
    <rect x="484" y="188" width="56" height="48" rx="12" fill="#172942"/><text x="512" y="218" fill="#eef5ff" font-size="14">+0,5</text>
    <rect x="20" y="248" width="250" height="48" rx="12" fill="#68e6a4"/><text x="145" y="278" fill="#06111f" font-size="15" font-weight="700">Guardar</text>
    <rect x="280" y="248" width="125" height="48" rx="12" fill="#172942"/><text x="342" y="278" fill="#eef5ff" font-size="14">Deshacer</text>
    <rect x="415" y="248" width="125" height="48" rx="12" fill="#172942"/><text x="477" y="278" fill="#eef5ff" font-size="14">Elegir</text>
  </g>
  <text x="24" y="326" fill="#ffd36e" font-family="Arial,sans-serif" font-size="12">Guardado en el dispositivo | Deshacer disponible</text>
  <rect x="20" y="340" width="520" height="34" rx="10" fill="#172942"/>
  <text x="280" y="362" text-anchor="middle" fill="#eef5ff" font-family="Arial,sans-serif" font-size="13">Descanso 01:12</text>
