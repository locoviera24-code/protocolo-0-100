<svg xmlns="http://www.w3.org/2000/svg" width="620" height="560" viewBox="0 0 620 560" role="img" aria-labelledby="title desc">
  <title id="title">Vista previa del widget expandido</title>
  <desc id="desc">Registro completo con ajustes de 0,5 y 5 kilos, selector directo, orientacion de carga y temporizador.</desc>
  <rect width="620" height="560" rx="30" fill="#071321"/>
