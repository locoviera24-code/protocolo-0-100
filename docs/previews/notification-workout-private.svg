  <text x="310" y="168" fill="#06111f" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700">Guardar</text>
  <text x="510" y="168" fill="#eef5ff" text-anchor="middle" font-family="sans-serif" font-size="16">Siguiente</text>
</svg>
